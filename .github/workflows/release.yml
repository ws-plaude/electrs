name: release

on:
  push:
    tags:
      - "v*-liana.*"

permissions:
  contents: write

jobs:
  linux:
    # The oldest supported runner, so the binary runs on any newer glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: sudo apt-get install -y build-essential libclang-dev

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          name="electrs-${GITHUB_REF_NAME}-x86_64-linux-gnu"
          mkdir "$name"
          cp target/release/electrs LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes "electrs ${GITHUB_REF_NAME#v} with the blocks fetched over RPC instead of p2p." \
            electrs-"$GITHUB_REF_NAME"-x86_64-linux-gnu.tar.gz*
